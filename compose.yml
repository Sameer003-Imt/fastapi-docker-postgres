services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: netwatch
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: netwatch
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://netwatch:secret@db:5432/netwatch
    depends_on:
      - db

volumes:
  db-data:
